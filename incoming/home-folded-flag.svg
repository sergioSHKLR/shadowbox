<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Ceremonial folded-flag triangle (placeholder). Desaturated navy/ivory only. -->
  <defs>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14233a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#3a4558" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14233a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e0d2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14233a" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Outer triangle (point right, classic fold) -->
  <path d="M40 240 L360 140 L40 40 Z" fill="url(#fold)" stroke="#14233a" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Fold ridges -->
  <path d="M40 240 L200 160 L40 80" fill="none" stroke="#e7e0d2" stroke-width="1.2" stroke-opacity="0.25"/>
  <path d="M40 200 L280 145" fill="none" stroke="#e7e0d2" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M40 120 L240 150" fill="none" stroke="#e7e0d2" stroke-width="1" stroke-opacity="0.18"/>
  <!-- Tiny star suggestion near the canton fold (very faint) -->
  <g fill="#e7e0d2" fill-opacity="0.22" transform="translate(70 130) scale(0.55)">
    <path d="M0,-10 L2.9,-3.1 L10,-3.1 L4.2,1.2 L6.5,8.1 L0,4 L-6.5,8.1 L-4.2,1.2 L-10,-3.1 L-2.9,-3.1 Z"/>
  </g>
</svg>
