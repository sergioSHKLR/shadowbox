name: Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "favicon.svg"
      - "og.jpg"
      - "assets/**"
      - "photos/**"
      - "ribbons/**"
      - "uniforms/**"
      - "crests/**"
      - "insignia/**"
      - "devices/**"
      - "equipment/**"
      - "icons/**"
      - "medals/**"
      - "shadowbox-cheat-sheet.pdf"
      - "manifest.webmanifest"
      - "sw.js"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: node scripts/place-pages-site.mjs
      - name: Commit the site onto main
        run: |
          git config user.name "sergioSHKLR"
          git config user.email "107352082+sergioSHKLR@users.noreply.github.com"
          for p in index.html 404.html .nojekyll favicon.svg og.jpg CNAME assets photos ribbons uniforms crests insignia devices equipment icons medals manifest.webmanifest sw.js shadowbox-cheat-sheet.pdf; do
            if [ -e "$p" ]; then
              git add "$p"
            elif git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git add -u -- "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "Site already matches this commit."
            exit 0
          fi
          git commit -m "Publish the shadowbox site [skip ci]"
          git push
