name: Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "favicon.svg"
      - "og.jpg"
      - "assets/**"
      - "photos/**"
      - "ribbons/**"
      - "uniforms/**"
      - "crests/**"
      - "insignia/**"
      - "devices/**"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: node scripts/place-pages-site.mjs
      - name: Commit the site onto main
        run: |
          git config user.name "sergioSHKLR"
          git config user.email "107352082+sergioSHKLR@users.noreply.github.com"
          git add index.html 404.html .nojekyll favicon.svg og.jpg assets photos ribbons uniforms crests insignia devices
          if git diff --cached --quiet; then
            echo "Site already matches this commit."
            exit 0
          fi
          git commit -m "Publish the shadowbox site [skip ci]"
          git push
