<svg xmlns="http://www.w3.org/2000/svg" width="1.5in" height="1.25in" viewBox="0 0 120 100"><title>Electronics Technician rating mark (oxidized silver, vector)</title>
<!-- Flat silver with dark outlines, to match the silver warfare pins of the chest stack. -->
<g transform="translate(60 50) scale(1.12)">
<g fill="none" stroke-linecap="round">
<g stroke="#141414" stroke-width="10"><ellipse rx="46" ry="15" transform="rotate(-12)"/><ellipse rx="42" ry="14" transform="rotate(62)"/></g>
<g stroke="#c4c4c4" stroke-width="6.2"><ellipse rx="46" ry="15" transform="rotate(-12)"/><ellipse rx="42" ry="14" transform="rotate(62)"/></g>
<g stroke="#8e8e8e" stroke-width="1.3"><ellipse rx="44.6" ry="13.7" transform="rotate(-12)"/><ellipse rx="40.6" ry="12.7" transform="rotate(62)"/></g>
<g stroke="#ececec" stroke-width="1.1"><ellipse rx="47.4" ry="16.3" transform="rotate(-12)"/><ellipse rx="43.4" ry="15.3" transform="rotate(62)"/></g>
</g>
<circle r="11" fill="#141414"/><circle r="8.6" fill="#c4c4c4"/><circle r="8.6" fill="none" stroke="#ececec" stroke-width="1.1" stroke-dasharray="14 40" transform="rotate(200)"/>
<polygon points="4,-30 -9,-2 1,-2 -6,28 11,-6 1,-6 10,-30" fill="#bdbdbd" stroke="#141414" stroke-width="2.6" stroke-linejoin="round"/>
