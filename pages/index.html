<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHADOWBOX</title>
    <meta
      name="description"
      content="SHADOWBOX: a Navy career, ribbon by ribbon. Not for gawking but for learning!"
    />
    <link rel="canonical" href="https://mil.shklr.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SHADOWBOX" />
    <meta property="og:title" content="SHADOWBOX" />
    <meta property="og:description" content="A Navy career, ribbon by ribbon. Not for gawking but for learning!" />
    <meta property="og:url" content="https://mil.shklr.org/" />
    <meta property="og:image" content="https://mil.shklr.org/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- The site has one designed (light) look: no automatic dark rendering of the page or its browser chrome. -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#f6f1e7" />
    <script>
      // Theme before first paint (no flash): saved light / dark, or "system" following prefers-color-scheme.
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("shadowbox-prefs") || "{}");
          var THEME_HONORED = true; // matches app.tsx THEME_SETTING_ENABLED: the Settings page choice (system / light / dark) is honored
          var pick = THEME_HONORED && (raw.theme === "light" || raw.theme === "dark") ? raw.theme : "system";
          var dark = pick === "dark" || (pick === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          // Text size from the Settings modal (prefs.ts FONT_SCALE), applied before first paint.
          var scale = { small: 87.5, large: 112.5, xlarge: 125 }[raw.fontSize];
          if (scale) { document.documentElement.style.fontSize = scale + "%"; document.documentElement.dataset.fontSize = raw.fontSize; }
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SHADOWBOX" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/pages-main.tsx"></script>
  </body>
</html>
