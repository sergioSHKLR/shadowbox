    <!-- Single mode (Sergio, Nov 2026): dark mode disabled; theme-color = top-bar navy. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#14233a" />
    <script>
      // Theme before first paint (no flash): saved light / dark, or "system" following prefers-color-scheme.
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("shadowbox-prefs") || "{}");
          var DARK_MODE_ENABLED = false; // matches app.tsx DARK_MODE_ENABLED: dark mode disabled (single light mode)
          var pick = (raw.theme === "light" || raw.theme === "dark") ? raw.theme : "system";
          var dark = DARK_MODE_ENABLED && (pick === "dark" || (pick === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches));
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var tint = document.querySelector('meta[name="theme-color"]:not([media])') || document.querySelector('meta[name="theme-color"]');
          if (tint) tint.content = dark ? "#14181f" : "#14233a";
          // Text size from the Settings modal (prefs.ts FONT_SCALE), applied before first paint.
          var scale = { small: 87.5, large: 112.5, xlarge: 125 }[raw.fontSize];
          if (scale) { document.documentElement.style.fontSize = scale + "%"; document.documentElement.dataset.fontSize = raw.fontSize; }
        } catch (e) {}
      })();
    </script>
