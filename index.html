    <script>
      // Theme before first paint (no flash): saved light / dark, or "system" following prefers-color-scheme.
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("shadowbox-prefs") || "{}");
          var THEME_SWITCH_ENABLED = false; // matches app.tsx: while the switch is hidden, everyone follows the device
          var pick = THEME_SWITCH_ENABLED && (raw.theme === "light" || raw.theme === "dark") ? raw.theme : "system";
          var dark = pick === "dark" || (pick === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
